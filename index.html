<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16251f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <style>.learn-card .translation{display:block;font-size:24px;color:#dce9e1;margin:12px 0}.learn-card small{display:block;color:#9db1a8;min-height:40px;margin:8px 0 34px}.learn-card>button{width:100%;margin-top:20px}.articles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}.articles button{padding:11px;background:#243b32;color:#dce9e1;border:1px solid #416254}.articles button.selected{background:#70dfa6;color:#0b1a13;border-color:#70dfa6}</style>
  <title>WortSprint</title>
</head>
<body>
  <main class="shell">
    <header><div><span class="eyebrow">NIEMIECKI · POWTÓRKI</span><h1>WortSprint</h1></div><div class="streak" id="streak">0 dni 🔥</div></header>
    <section id="home">
      <div class="hero"><p>Dzisiaj</p><strong id="dueCount">—</strong><span>zaległych powtórek</span><button id="start">Zacznij sesję</button></div>
      <div class="panel"><label for="topic">Temat</label><select id="topic"></select><label for="size">Długość rundy</label><select id="size"><option value="random" selected>Niespodzianka (8–12)</option><option>8</option><option>10</option><option>12</option></select></div>
      <div class="stats"><div><strong id="known">0</strong><span>opanowane</span></div><div><strong id="learning">0</strong><span>w nauce</span></div><div><strong id="total">0</strong><span>wszystkie</span></div></div>
      <button class="ghost" id="reset">Wyzeruj postępy</button>
    </section>
    <section id="learn" hidden>
      <div class="progress"><span id="learnProgress"></span><i><b id="learnBar"></b></i></div>
      <article class="card learn-card">
        <span class="tag" id="learnTopic"></span><p>Nowe słowo</p><h2 id="learnGerman"></h2>
        <strong class="translation" id="learnPolish"></strong><small id="learnExtra"></small>
        <button id="learnNext" onclick="nextLearn()">Zapamiętaj i dalej</button>
      </article>
    </section>
    <section id="quiz" hidden>
      <div class="progress"><span id="progressText"></span><i><b id="progressBar"></b></i></div>
      <article class="card">
        <span class="tag" id="cardTopic"></span><p>Przetłumacz na niemiecki</p><h2 id="prompt"></h2>
        <div class="articles" id="articleChoices" hidden>
          <button type="button" data-article="der" onclick="selectArticle('der')">der</button><button type="button" data-article="die" onclick="selectArticle('die')">die</button><button type="button" data-article="das" onclick="selectArticle('das')">das</button>
        </div>
        <div class="articles" id="caseChoices" hidden>
          <button type="button" data-case="akk" onclick="selectCase('akk')">+ Akk.</button><button type="button" data-case="dat" onclick="selectCase('dat')">+ Dat.</button><button type="button" data-case="none" onclick="selectCase('none')">brak</button>
        </div>
        <form id="answerForm"><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Wpisz odpowiedź…"><button>Sprawdź</button></form>
        <div id="feedback" hidden><p id="verdict"></p><strong id="correctAnswer"></strong><small id="hint"></small><div class="ratings"><button data-grade="0">Nie pamiętam</button><button data-grade="1">Prawie</button><button data-grade="2">Wiedziałem</button></div></div>
      </article>
      <button class="ghost" id="quit">Zakończ sesję</button>
    </section>
    <section id="summary" hidden><div class="hero"><p id="summaryTitle">Sesja skończona</p><strong id="score"></strong><span id="summaryText">poprawnych odpowiedzi</span><button id="again">Wróć</button></div></section>
  </main>
  <script src="words.js"></script><script src="app.js"></script>
</body>
</html>
